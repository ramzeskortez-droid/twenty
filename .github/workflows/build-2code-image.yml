name: Build 2code image

# Сборка кастомного образа Twenty для crm.2-code.ru.
# Запуск: вручную (workflow_dispatch, любая ветка) или пушем тега 2code-v*.
# Образ публикуется в ghcr.io/ramzeskortez-droid/twenty.

on:
  workflow_dispatch:
  push:
    tags:
      - '2code-v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/twenty:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/twenty:latest-2code
          cache-from: type=gha
          cache-to: type=gha,mode=max
